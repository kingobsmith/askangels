<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Ask Angels</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a class="brand" href="/">ASK ANGELS</a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/#angels">Angels</a>
        <a href="/soulcare">SoulCare</a>
        <a href="/login">Login</a>
        <a href="/subscribe">Subscribe</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="page-header">
      <h1>Contact</h1>
      <p class="lead">Reach the Ask Angels team.</p>
    </section>

    <div class="form-card">
      <form action="#" method="post" onsubmit="event.preventDefault(); alert('Message received. We will be in touch.');">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <input type="text" id="message" name="message" placeholder="How can we help?" required />
        </div>
        <button class="btn" type="submit" style="width:100%">Send Message</button>
      </form>
      <p class="form-note">Email: <a href="mailto:hello@askangels.co">hello@askangels.co</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-copy">Ask Angels</div>
      <div class="footer-links">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="/contact">Contact</a>
      </div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
